name: Resumen LAB - actualizar mails

on:
  # Sin cron nativo de GitHub: se demostro poco confiable (dejaba de disparar
  # solo despues de las primeras corridas) y ademas podia solaparse con el
  # disparador externo y matar corridas a mitad de camino. El unico disparador
  # automatico es el externo (cron-job.org, cada 30 min via workflow_dispatch).
  workflow_dispatch:
    inputs:
      backfill_hours:
        description: >-
          Dejar vacio para la corrida normal (incremental por historyId).
          Poner un numero (ej. 24) para hacer un barrido unico de las
          ultimas N horas por fecha, SIN tocar el checkpoint de las corridas
          en vivo — sirve para completar historial que el checkpoint ya
          dejo atras.
        required: false
        default: ""
      provision_users:
        description: >-
          SOLO para dar de alta usuarios de login. Dejar vacio en corridas
          normales. Si se completa, la corrida NO revisa mails: da de alta
          cada usuario en Supabase Auth. Formato: un "usuario:codigo" por
          linea, ej. Lautaro_Rojas:ABCD1234 (pegar tal cual, nunca queda
          guardado en el repo — solo vive en esta corrida puntual).
        required: false
        default: ""
      boca_force_update:
        description: >-
          Poner "true" para forzar la actualizacion del fixture de Boca
          ahora mismo (sin esperar al lunes) — solo para probar el scraping.
          Dejar vacio en corridas normales.
        required: false
        default: ""
      reset_password:
        description: >-
          SOLO para resetear la contraseña de un usuario que ya existe (se
          la olvido). Dejar vacio en corridas normales. Si se completa, la
          corrida NO revisa mails: pisa la contraseña por un codigo temporal
          y lo obliga a elegir una nueva en el proximo login. Formato: un
          "usuario:codigo" por linea, igual que provision_users.
        required: false
        default: ""

concurrency:
  group: resumen-lab-update
  # No cancelar una corrida en progreso: si llega un segundo disparo mientras
  # la anterior sigue corriendo, se encola en vez de matarla (evita perder
  # progreso cuando el script tarda mas que el intervalo entre disparos).
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Correr script de Resumen LAB
        env:
          GMAIL_OAUTH_CLIENT_ID: ${{ secrets.GMAIL_OAUTH_CLIENT_ID }}
          GMAIL_OAUTH_CLIENT_SECRET: ${{ secrets.GMAIL_OAUTH_CLIENT_SECRET }}
          GMAIL_OAUTH_REFRESH_TOKEN: ${{ secrets.GMAIL_OAUTH_REFRESH_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BACKFILL_HOURS: ${{ github.event.inputs.backfill_hours }}
          PROVISION_USERS: ${{ github.event.inputs.provision_users }}
          BOCA_FORCE_UPDATE: ${{ github.event.inputs.boca_force_update }}
          RESET_PASSWORD: ${{ github.event.inputs.reset_password }}
        run: python scripts/resumen_lab.py
