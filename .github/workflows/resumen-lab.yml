name: Resumen LAB - actualizar mails

on:
  schedule:
    # cada 15 minutos (el disparador externo de cron-job.org tambien pega
    # cada tanto via workflow_dispatch, este queda como respaldo)
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

concurrency:
  group: resumen-lab-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Correr script de Resumen LAB
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/resumen_lab.py
