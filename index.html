<script>
(function () {
  // ---- Theme handling ----
  var THEME_KEY = "resumenLabTheme";
  var root = document.documentElement;
  var themeToggle = document.getElementById("themeToggle");

  function applyTheme(theme) {
    if (theme === "dark") {
      root.setAttribute("data-theme", "dark");
      themeToggle.textContent = "☀️";
    } else {
      root.removeAttribute("data-theme");
      themeToggle.textContent = "🌙";
    }
  }

  function getInitialTheme() {
    try {
      var saved = localStorage.getItem(THEME_KEY);
      if (saved === "dark" || saved === "light") return saved;
    } catch (e) {}
    return (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
  }

  var currentTheme = getInitialTheme();
  applyTheme(currentTheme);

  // ---- Config / conexion a Supabase ----
  var configEl = document.getElementById("supabase-config");
  var config = JSON.parse(configEl.textContent || "{}");
  var SUPABASE_URL = config.url;
  var SUPABASE_ANON_KEY = config.anonKey;
  var lastRunInfo = null; // se carga async desde la tabla "meta"

  // Quita prefijos de respuesta/reenvio (RE:, FW:, FWD:, RV:, etc.) del
  // inicio del asunto, incluso repetidos ("RE: RE: FW: Orion") y con o sin
  // acentos/mayusculas, para mostrar el nombre de la cadena limpio.
  var SUBJECT_PREFIX_RE = /^\s*(re|fw|fwd|rv|rr)\s*:\s*/i;
  function cleanSubject(subject) {
    var s = subject || "";
    var prev;
    do {
      prev = s;
      s = s.replace(SUBJECT_PREFIX_RE, "");
    } while (s !== prev);
    return s;
  }

  function normalizeRow(row) {
    return {
      subject: cleanSubject(row.subject),
      categories: row.categories || [],
      sentAtMs: row.sent_at ? Date.parse(row.sent_at) : null,
      firstSeenMs: row.first_seen_at ? Date.parse(row.first_seen_at) : null,
      resolved: row.closure_detected === true
    };
  }

  async function fetchMails(fromMs, toMs, opts) {
    opts = opts || {};
    var params = [
      "select=subject,categories,sent_at,first_seen_at,closure_detected",
      "sent_at=gte." + encodeURIComponent(new Date(fromMs).toISOString()),
      "sent_at=lte." + encodeURIComponent(new Date(toMs).toISOString()),
      "order=sent_at.desc",
      "limit=2000"
    ];
    if (opts.category) {
      params.push("categories=cs." + encodeURIComponent("{" + opts.category + "}"));
    } else if (opts.categoriesAny && opts.categoriesAny.length) {
      // "ov" = overlap: trae mails que tengan AL MENOS UNA de estas categorias.
      params.push("categories=ov." + encodeURIComponent("{" + opts.categoriesAny.join(",") + "}"));
    }
    var url = SUPABASE_URL + "/rest/v1/mails?" + params.join("&");
    var resp = await fetch(url, {
      headers: { apikey: SUPABASE_ANON_KEY, Authorization: "Bearer " + SUPABASE_ANON_KEY }
    });
    if (!resp.ok) throw new Error("HTTP " + resp.status);
    var rows = await resp.json();
    return rows.map(normalizeRow);
  }

  async function fetchActivityMails(dateStr, categoriesList) {
    // Usa la tabla mail_activity (historial de en que dia hubo actividad de
    // cada hilo) en vez de filtrar "mails" por sent_at — asi un hilo que
    // tuvo actividad ayer sigue apareciendo en la vista de "ayer" aunque
    // despues haya seguido la cadena hoy (sent_at ya no queda "en ayer").
    var params = [
      "select=category,mails(subject,sent_at,first_seen_at,closure_detected)",
      "activity_date=eq." + encodeURIComponent(dateStr),
      "category=in.(" + categoriesList.join(",") + ")"
    ];
    var url = SUPABASE_URL + "/rest/v1/mail_activity?" + params.join("&");
    var resp = await fetch(url, {
      headers: { apikey: SUPABASE_ANON_KEY, Authorization: "Bearer " + SUPABASE_ANON_KEY }
    });
    if (!resp.ok) throw new Error("HTTP " + resp.status);
    var rows = await resp.json();
    return rows.map(function (r) {
      var m = r.mails || {};
      return {
        category: r.category,
        subject: cleanSubject(m.subject),
        sentAtMs: m.sent_at ? Date.parse(m.sent_at) : null,
        firstSeenMs: m.first_seen_at ? Date.parse(m.first_seen_at) : null,
        resolved: m.closure_detected === true
      };
    });
  }

  async function fetchLastRun() {
    try {
      var url = SUPABASE_URL + "/rest/v1/meta?key=eq.last_run&select=value";
      var resp = await fetch(url, {
        headers: { apikey: SUPABASE_ANON_KEY, Authorization: "Bearer " + SUPABASE_ANON_KEY }
      });
      if (!resp.ok) return null;
      var rows = await resp.json();
      return rows.length ? rows[0].value : null;
    } catch (e) {
      return null;
    }
  }

  // Base categories stored per-mail. Las que terminan en Nuevo/EnCurso se
  // parten en dos al renderizar, segun que tan vieja sea la cadena AHORA —
  // asi el split es siempre correcto, aunque el mail se haya guardado hace rato.
  //
  // Orden pensado para el layout de la solapa Resumen: primero (mas grandes,
  // "big") Afectaciones masivas y Mail de Referente, bien visibles arriba de
  // todo; despues dos columnas parejas (IT/Ingenieria/Informes a la
  // izquierda, Operacion Tecnica/MSK/LY a la derecha).
  var CATEGORY_META = [
    { key: "afectacionMasiva", label: "Afectaciones masivas", icon: "🚨", rgb: "216,71,47", big: true },
    { key: "pedidosReferentes", label: "Mail de Referente", icon: "📨", rgb: "24,138,102", big: true },
    { key: "itNuevo", label: "Escalamientos nuevos · IT", icon: "🆕", rgb: "44,123,229" },
    { key: "operacionTecnicaNuevo", label: "Operación Técnica · Nuevos", icon: "🆕", rgb: "6,148,162" },
    { key: "itEnCurso", label: "Escalamientos en curso · IT", icon: "🔄", rgb: "44,123,229" },
    { key: "operacionTecnicaEnCurso", label: "Operación Técnica · En curso", icon: "🔄", rgb: "6,148,162" },
    { key: "ingenieriaNuevo", label: "Escalamientos nuevos · Ingeniería", icon: "🆕", rgb: "76,139,43" },
    { key: "operacionMSKNuevo", label: "Operación MSK · Nuevos", icon: "🆕", rgb: "138,92,214" },
    { key: "ingenieriaEnCurso", label: "Escalamientos en curso · Ingeniería", icon: "🔄", rgb: "76,139,43" },
    { key: "operacionMSKEnCurso", label: "Operación MSK · En curso", icon: "🔄", rgb: "138,92,214" },
    { key: "informesFija", label: "Informes Fija", icon: "☎️", rgb: "13,120,140" },
    { key: "operacionLYNuevo", label: "Operación LY · Nuevos", icon: "🆕", rgb: "199,120,17" },
    { key: "informesMovil", label: "Informes 611", icon: "📱", rgb: "163,86,196" },
    { key: "operacionLYEnCurso", label: "Operación LY · En curso", icon: "🔄", rgb: "199,120,17" }
  ];

  // Solapa aparte "Tareas" (antes vivia adentro de Resumen).
  var TAREAS_META = [
    { key: "tareas", label: "Tareas (WBS)", icon: "📋", rgb: "106,92,245" }
  ];

  // Mapa generico: que categorias guardadas en la base se parten en
  // Nuevo/EnCurso segun antiguedad (con su propio umbral en horas), vs.
  // cuales van directo a un solo bucket.
  var AGE_SPLIT_CATEGORY_KEYS = {
    it: { keys: ["itNuevo", "itEnCurso"], thresholdHours: 5 },
    ingenieria: { keys: ["ingenieriaNuevo", "ingenieriaEnCurso"], thresholdHours: 5 },
    operacionTecnica: { keys: ["operacionTecnicaNuevo", "operacionTecnicaEnCurso"], thresholdHours: 6 },
    operacionMSK: { keys: ["operacionMSKNuevo", "operacionMSKEnCurso"], thresholdHours: 6 },
    operacionLY: { keys: ["operacionLYNuevo", "operacionLYEnCurso"], thresholdHours: 6 }
  };
  var DIRECT_CATEGORY_KEYS = ["afectacionMasiva", "pedidosReferentes", "informesFija", "informesMovil"];

  // Solapa aparte "Escalamientos IT": cualquier mail (de cualquier remitente)
  // enviado a Gestion de Incidentes / Help Desk / Help Desk Billetera.
  var ESCALAMIENTOS_IT_META = [
    { key: "escalamientosITNuevo", label: "Escalamientos IT · Nuevo", icon: "🚦", rgb: "214,127,17" },
    { key: "escalamientosITEnCurso", label: "Escalamientos IT · En curso", icon: "🔥", rgb: "214,127,17" },
    { key: "afectacionesMasivasIT", label: "Afectaciones masivas IT", icon: "🚨", rgb: "216,71,47" }
  ];

  // Solapa aparte "Resumen por lapso": listado plano (sin split Nuevo/EnCurso)
  // por rango de fechas elegido a mano. Usa 6 categorias propias, con reglas
  // de clasificacion DISTINTAS de las que arman las otras solapas aunque
  // "operacionTecnica"/"operacionMSK"/"operacionLY" compartan nombre con las
  // de Resumen (ahi si se parten en Nuevo/EnCurso; aca van planas).
  var LAPSO_META = [
    { key: "afectacionMasivaLapso", label: "Afectaciones masivas", icon: "🚨", rgb: "216,71,47" },
    { key: "escalamientosIT_GIM", label: "Escalamientos IT · GIM", icon: "🆘", rgb: "44,123,229" },
    { key: "escalamientosIT_HDB", label: "Escalamientos IT · HDB", icon: "🆘", rgb: "44,123,229" },
    { key: "escalamientosIT_HelpDesk", label: "Escalamientos IT · HelpDesk", icon: "🆘", rgb: "44,123,229" },
    { key: "escalamientosING_VOC", label: "Escalamientos ING · VOC", icon: "🛠️", rgb: "76,139,43" },
    { key: "escalamientosING_SOC", label: "Escalamientos ING · SOC", icon: "🛠️", rgb: "76,139,43" },
    { key: "escalamientosING_NOC", label: "Escalamientos ING · NOC", icon: "🛠️", rgb: "76,139,43" },
    { key: "operacionTecnica", label: "Operación Técnica", icon: "📡", rgb: "6,148,162" },
    { key: "operacionMSK", label: "Operación MSK", icon: "🧭", rgb: "138,92,214" },
    { key: "operacionLY", label: "Operación Loyalty", icon: "🎯", rgb: "199,120,17" }
  ];
  var LAPSO_CATEGORY_KEYS = LAPSO_META.map(function (m) { return m.key; });

  // A diferencia de buildBuckets, esta version NUNCA aplica el split
  // Nuevo/EnCurso: cada categoria va directo a su bucket plano, ordenada por
  // fecha, tal cual la pidio el usuario ("una abajo de la otra").
  function buildLapsoBuckets(mailsInRange) {
    var buckets = {};
    LAPSO_CATEGORY_KEYS.forEach(function (k) { buckets[k] = []; });

    var sorted = mailsInRange.slice().sort(function (a, b) { return b.sentAtMs - a.sentAtMs; });

    sorted.forEach(function (m) {
      (m.categories || []).forEach(function (cat) {
        if (cat in buckets) {
          buckets[cat].push({ subject: m.subject, resolved: m.resolved === true });
        }
      });
    });

    return buckets;
  }

  // La solapa "Resumen" siempre muestra una ventana viva de las ultimas 6
  // horas: no hay selector, se recalcula sola en cada refresh automatico.
  var RESUMEN_WINDOW_HOURS = 6;
  var RESUMEN_REFRESH_MS = 2 * 60 * 1000; // recalcula la ventana cada 2 min

  var rangeLine = document.getElementById("rangeLine");
  var cardsEl = document.getElementById("cards");
  var cardsEscITEl = document.getElementById("cardsEscIT");
  var cardsTareasEl = document.getElementById("cardsTareas");
  var cardsLapsoEl = document.getElementById("cardsLapso");
  var rangeLineEscITEl = document.getElementById("rangeLineEscIT");
  var rangeLineTareasEl = document.getElementById("rangeLineTareas");
  var rangeLineLapsoEl = document.getElementById("rangeLineLapso");
  var rangePanelEl = document.getElementById("rangePanel");
  var tabButtons = document.querySelectorAll(".rl-tab");
  var currentTab = "resumen";
  var currentLapsoRange = null; // { fromMs, toMs } una vez que se genera

  function applyTabStyles() {
    tabButtons.forEach(function (btn) {
      var active = btn.getAttribute("data-tab") === currentTab;
      btn.style.color = active ? "var(--accent)" : "var(--text-secondary)";
      btn.style.borderBottomColor = active ? "var(--accent)" : "transparent";
    });
    var isResumen = currentTab === "resumen";
    var isEscIT = currentTab === "escalamientosIT";
    var isTareas = currentTab === "tareas";
    var isLapso = currentTab === "lapso";

    cardsEl.style.display = isResumen ? "grid" : "none";
    cardsEscITEl.style.display = isEscIT ? "grid" : "none";
    cardsTareasEl.style.display = isTareas ? "grid" : "none";
    cardsLapsoEl.style.display = isLapso ? "grid" : "none";

    rangeLine.style.display = isResumen ? "block" : "none";
    rangeLineEscITEl.style.display = isEscIT ? "block" : "none";
    rangeLineTareasEl.style.display = isTareas ? "block" : "none";
    rangeLineLapsoEl.style.display = isLapso ? "block" : "none";

    rangePanelEl.style.display = isLapso ? "block" : "none";

    if (isEscIT) renderEscalamientosIT();
    if (isTareas) refreshTareasWindow();
    if (isLapso) rerenderLapso();
  }

  tabButtons.forEach(function (btn) {
    btn.addEventListener("click", function () {
      currentTab = btn.getAttribute("data-tab");
      applyTabStyles();
    });
  });

  var currentRange = null; // { fromMs, toMs, label, mailCount }

  function fmt(ts) {
    if (!ts && ts !== 0) return "";
    var d = new Date(ts);
    return d.toLocaleString("es-AR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
  }

  function isDark() {
    return root.getAttribute("data-theme") === "dark";
  }

  function fmtDuration(hours) {
    if (typeof hours !== "number" || isNaN(hours)) return "";
    var totalMin = Math.round(hours * 60);
    var d = Math.floor(totalMin / (24 * 60));
    var h = Math.floor((totalMin % (24 * 60)) / 60);
    var m = totalMin % 60;
    if (d > 0) return d + "d " + h + "h";
    if (h > 0) return h + "h " + m + "m";
    return m + "m";
  }

  function buildBuckets(mailsInRange, metaList) {
    metaList = metaList || CATEGORY_META;
    var nowMs = Date.now();
    var buckets = {};
    metaList.forEach(function (m) { buckets[m.key] = []; });

    var sorted = mailsInRange.slice().sort(function (a, b) { return b.sentAtMs - a.sentAtMs; });

    sorted.forEach(function (m) {
      (m.categories || []).forEach(function (cat) {
        if (AGE_SPLIT_CATEGORY_KEYS[cat]) {
          var conf = AGE_SPLIT_CATEGORY_KEYS[cat];
          if (!(conf.keys[0] in buckets)) return;
          var originMs = (typeof m.firstSeenMs === "number") ? m.firstSeenMs : m.sentAtMs;
          var ageHours = (nowMs - originMs) / 3600000;
          var key = ageHours >= conf.thresholdHours ? conf.keys[1] : conf.keys[0];
          buckets[key].push({ subject: m.subject, ageHours: ageHours, originMs: originMs });
        } else if (DIRECT_CATEGORY_KEYS.indexOf(cat) !== -1) {
          if (!(cat in buckets)) return;
          buckets[cat].push({ subject: m.subject, resolved: m.resolved === true });
        } else if (cat in buckets) {
          buckets[cat].push({ subject: m.subject, resolved: m.resolved === true });
        }
      });
    });

    return buckets;
  }

  function renderCards(buckets, dark, targetEl, metaList) {
    targetEl.innerHTML = "";
    metaList.forEach(function (meta) {
      var items = (buckets && buckets[meta.key]) || [];
      var hasItems = items.length > 0;
      var accentColor = dark ? "rgba(" + meta.rgb + ",0.95)" : "rgb(" + meta.rgb + ")";
      var softBg = dark ? "rgba(" + meta.rgb + ",0.22)" : "rgba(" + meta.rgb + ",0.12)";

      var big = meta.big === true;

      var card = document.createElement("div");
      card.className = "rl-card";
      card.style.cssText = "border:1px solid var(--card-border);border-radius:16px;padding:" + (big ? "24px 26px 25px" : "18px 20px 19px") + ";background:var(--card-bg);box-shadow:var(--shadow-soft);display:flex;flex-direction:column;" + (big ? "min-height:150px;" : "");

      var head = document.createElement("div");
      head.style.cssText = "display:flex;align-items:center;justify-content:space-between;gap:10px;" + (hasItems ? "margin-bottom:" + (big ? "16px;" : "12px;") : "");

      var titleWrap = document.createElement("div");
      titleWrap.style.cssText = "display:flex;align-items:center;gap:" + (big ? "13px" : "10px") + ";min-width:0;";

      var iconEl = document.createElement("span");
      var iconSize = big ? 40 : 30;
      iconEl.style.cssText = "width:" + iconSize + "px;height:" + iconSize + "px;border-radius:" + (big ? 10 : 8) + "px;background:" + softBg + ";display:flex;align-items:center;justify-content:center;font-size:" + (big ? 20 : 15) + "px;flex-shrink:0;";
      iconEl.textContent = meta.icon;

      var titleEl = document.createElement("span");
      titleEl.style.cssText = "font-size:" + (big ? "19px" : "15.5px") + ";font-weight:700;color:var(--text-title);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;";
      titleEl.textContent = meta.label;

      titleWrap.appendChild(iconEl);
      titleWrap.appendChild(titleEl);

      var badge = document.createElement("span");
      badge.style.cssText = "font-size:" + (big ? "15px" : "13px") + ";font-weight:700;color:" + (hasItems ? "#fff" : accentColor) + ";background:" + (hasItems ? accentColor : softBg) + ";border-radius:999px;padding:" + (big ? "4px 14px" : "3px 11px") + ";flex-shrink:0;";
      badge.textContent = items.length;

      head.appendChild(titleWrap);
      head.appendChild(badge);
      card.appendChild(head);

      if (hasItems) {
        var list = document.createElement("div");
        list.style.cssText = "max-height:" + (big ? "340px" : "220px") + ";overflow-y:auto;border-top:1px solid var(--divider);margin-top:2px;padding-top:9px;";
        items.forEach(function (item) {
          var row = document.createElement("div");
          row.className = "rl-row";
          var resolved = item.resolved === true;
          var hasOrigin = typeof item.originMs === "number";
          row.style.cssText = "font-size:14.5px;line-height:1.5;padding:8px 6px;border-radius:8px;color:" + (resolved ? "var(--text-muted)" : "var(--text-primary)") + ";" + (resolved ? "text-decoration:line-through;text-decoration-color:var(--text-muted);" : "") + (hasOrigin ? "cursor:pointer;" : "");
          var age = typeof item.ageHours === "number" ? "<span style='color:var(--text-muted);font-weight:500;'> · " + fmtDuration(item.ageHours) + (hasOrigin ? " ▾" : "") + "</span>" : "";
          var check = resolved ? "<span style='text-decoration:none;color:#1f9d63;font-weight:700;'>✓ </span>" : "";
          var mainLine = document.createElement("div");
          mainLine.innerHTML = check + "- " + (item.subject || "(sin asunto)") + age;
          row.appendChild(mainLine);

          if (hasOrigin) {
            var detail = document.createElement("div");
            detail.style.cssText = "display:none;font-size:13px;color:var(--text-muted);margin-top:4px;padding-left:2px;";
            detail.textContent = "Comenzó: " + fmt(item.originMs);
            row.appendChild(detail);
            row.addEventListener("click", function () {
              detail.style.display = detail.style.display === "none" ? "block" : "none";
            });
          }

          list.appendChild(row);
        });
        card.appendChild(list);
      } else {
        var empty = document.createElement("div");
        empty.style.cssText = "font-size:14px;color:var(--text-muted);font-style:italic;";
        empty.textContent = "Sin novedades";
        card.appendChild(empty);
      }

      targetEl.appendChild(card);
    });
  }

  function lastRunSuffix() {
    return lastRunInfo ? "  ·  última lectura de bandeja " + fmt(lastRunInfo.timestamp) : "";
  }

  async function applyRange(fromMs, toMs, label) {
    rangeLine.textContent = label + "  ·  rango " + fmt(fromMs) + " → " + fmt(toMs) + "  ·  cargando…";
    var fetched;
    try {
      fetched = await fetchMails(fromMs, toMs);
    } catch (e) {
      rangeLine.textContent = label + "  ·  error cargando datos: " + e.message;
      return;
    }
    currentRange = { fromMs: fromMs, toMs: toMs, label: label, mails: fetched };

    var dark = isDark();
    rangeLine.textContent = label + "  ·  rango " + fmt(fromMs) + " → " + fmt(toMs) +
      "  ·  " + fetched.length + (fetched.length === 1 ? " mail" : " mails") + lastRunSuffix();

    var buckets = buildBuckets(fetched);
    renderCards(buckets, dark, cardsEl, CATEGORY_META);
  }

  async function applyLapsoRange(fromMs, toMs) {
    rangeLineLapsoEl.textContent = "Rango " + fmt(fromMs) + " → " + fmt(toMs) + "  ·  cargando…";
    var fetched;
    try {
      fetched = await fetchMails(fromMs, toMs, { categoriesAny: LAPSO_CATEGORY_KEYS });
    } catch (e) {
      rangeLineLapsoEl.textContent = "Error cargando datos: " + e.message;
      return;
    }
    currentLapsoRange = { fromMs: fromMs, toMs: toMs, mails: fetched };
    var dark = isDark();
    rangeLineLapsoEl.textContent = "Rango " + fmt(fromMs) + " → " + fmt(toMs) +
      "  ·  " + fetched.length + (fetched.length === 1 ? " mail" : " mails") + lastRunSuffix();
    var buckets = buildLapsoBuckets(fetched);
    renderCards(buckets, dark, cardsLapsoEl, LAPSO_META);
  }

  function rerenderLapso() {
    if (currentLapsoRange) {
      var dark = isDark();
      var buckets = buildLapsoBuckets(currentLapsoRange.mails);
      renderCards(buckets, dark, cardsLapsoEl, LAPSO_META);
    } else {
      rangeLineLapsoEl.textContent = "Elegí un rango de fechas y horas arriba y tocá \"Generar resumen\".";
      cardsLapsoEl.innerHTML = "";
    }
  }

  var ARG_OFFSET_MS = 3 * 3600 * 1000; // Argentina es UTC-3 fijo

  function argDateStr(ms) {
    var shifted = new Date(ms - ARG_OFFSET_MS);
    var y = shifted.getUTCFullYear();
    var m = String(shifted.getUTCMonth() + 1).padStart(2, "0");
    var d = String(shifted.getUTCDate()).padStart(2, "0");
    return y + "-" + m + "-" + d;
  }

  function startOfArgTodayMs(nowMs) {
    var shifted = new Date(nowMs - ARG_OFFSET_MS);
    var startShifted = Date.UTC(shifted.getUTCFullYear(), shifted.getUTCMonth(), shifted.getUTCDate(), 0, 0, 0, 0);
    return startShifted + ARG_OFFSET_MS;
  }

  var currentEscIT = null; // { rows, yestStartMs, yestDateStr }

  async function renderEscalamientosIT() {
    var nowMs = Date.now();
    var todayStartMs = startOfArgTodayMs(nowMs);
    var yestStartMs = todayStartMs - 24 * 3600 * 1000;
    var yestDateStr = argDateStr(yestStartMs);
    rangeLineEscITEl.textContent = "Ayer  ·  cargando…";

    var rows;
    try {
      rows = await fetchActivityMails(yestDateStr, ["escalamientosIT", "afectacionesMasivasIT"]);
    } catch (e) {
      rangeLineEscITEl.textContent = "Error cargando datos: " + e.message;
      return;
    }
    currentEscIT = { rows: rows, yestStartMs: yestStartMs, yestDateStr: yestDateStr };
    renderEscalamientosITFromCache();
  }

  function renderEscalamientosITFromCache() {
    if (!currentEscIT) return;
    var yestStartMs = currentEscIT.yestStartMs;
    var rows = currentEscIT.rows;
    var dark = isDark();

    // Cada fila de mail_activity ya viene atada a UNA categoria puntual (la
    // tabla se llena una vez por dia/categoria/hilo), asi que un hilo que
    // tuvo actividad ayer sigue apareciendo aca aunque hoy haya seguido.
    var buckets = { escalamientosITNuevo: [], escalamientosITEnCurso: [], afectacionesMasivasIT: [] };
    rows.forEach(function (r) {
      var originMs = (typeof r.firstSeenMs === "number") ? r.firstSeenMs : r.sentAtMs;
      var ageHours = (Date.now() - originMs) / 3600000;
      if (r.category === "afectacionesMasivasIT") {
        buckets.afectacionesMasivasIT.push({ subject: r.subject, ageHours: ageHours, originMs: originMs });
      } else if (r.category === "escalamientosIT") {
        // "Nuevo" = la cadena arranco ayer. "En curso" = viene de dias
        // anteriores a ayer, pero tuvo actividad ayer.
        var key = originMs >= yestStartMs ? "escalamientosITNuevo" : "escalamientosITEnCurso";
        buckets[key].push({ subject: r.subject, ageHours: ageHours, originMs: originMs });
      }
    });

    var yestLabel = new Date(yestStartMs).toLocaleDateString("es-AR", { day: "2-digit", month: "2-digit", year: "numeric" });
    rangeLineEscITEl.textContent = "Ayer " + yestLabel + " (día completo, hora Argentina)  ·  " +
      rows.length + (rows.length === 1 ? " mail" : " mails") + lastRunSuffix();

    renderCards(buckets, dark, cardsEscITEl, ESCALAMIENTOS_IT_META);
  }

  function refreshResumenWindow() {
    var toMs = Date.now();
    var fromMs = toMs - RESUMEN_WINDOW_HOURS * 3600000;
    return applyRange(fromMs, toMs, "Últimas " + RESUMEN_WINDOW_HOURS + " horas (en vivo)");
  }

  var currentTareas = null; // { fromMs, toMs, mails }

  async function refreshTareasWindow() {
    var toMs = Date.now();
    var fromMs = toMs - RESUMEN_WINDOW_HOURS * 3600000;
    rangeLineTareasEl.textContent = "Últimas " + RESUMEN_WINDOW_HOURS + " horas (en vivo)  ·  cargando…";
    var fetched;
    try {
      fetched = await fetchMails(fromMs, toMs, { category: "tareas" });
    } catch (e) {
      rangeLineTareasEl.textContent = "Error cargando datos: " + e.message;
      return;
    }
    currentTareas = { fromMs: fromMs, toMs: toMs, mails: fetched };
    renderTareasFromCache();
  }

  function renderTareasFromCache() {
    if (!currentTareas) return;
    var dark = isDark();
    var buckets = buildBuckets(currentTareas.mails, TAREAS_META);
    rangeLineTareasEl.textContent = "Últimas " + RESUMEN_WINDOW_HOURS + " horas (en vivo)  ·  rango " +
      fmt(currentTareas.fromMs) + " → " + fmt(currentTareas.toMs) + "  ·  " +
      currentTareas.mails.length + (currentTareas.mails.length === 1 ? " mail" : " mails") + lastRunSuffix();
    renderCards(buckets, dark, cardsTareasEl, TAREAS_META);
  }

  function rerenderCurrent() {
    if (currentRange) {
      var dark = isDark();
      var buckets = buildBuckets(currentRange.mails);
      renderCards(buckets, dark, cardsEl, CATEGORY_META);
    }
    if (currentTab === "escalamientosIT") renderEscalamientosITFromCache();
    if (currentTab === "tareas") renderTareasFromCache();
    if (currentTab === "lapso") rerenderLapso();
  }

  function showErrorBanner(msg) {
    var dark0 = isDark();
    var errBox = document.createElement("div");
    errBox.style.cssText = "border:1px solid " + (dark0 ? "#5c3630" : "#f3c9c2") + ";background:" + (dark0 ? "#2c1c1a" : "#fdf1ef") + ";border-radius:14px;padding:15px 17px;font-size:14.5px;color:" + (dark0 ? "#f0a598" : "#a83b2a") + ";display:flex;gap:10px;align-items:flex-start;margin-bottom:16px;";
    errBox.innerHTML = "<span>⚠️</span><span>La última corrida tuvo un error: " + msg + "</span>";
    cardsEl.parentNode.insertBefore(errBox, cardsEl);
  }

  async function bootstrap() {
    applyTabStyles();
    await refreshResumenWindow();

    fetchLastRun().then(function (value) {
      lastRunInfo = value;
      if (lastRunInfo && lastRunInfo.error) showErrorBanner(lastRunInfo.error);
      rerenderCurrent();
    });

    // La ventana de "Resumen" se recalcula sola cada tanto: al pasar el
    // tiempo, mails viejos van saliendo de las ultimas 6hs y los nuevos que
    // fueron llegando (via las corridas automaticas) van entrando, sin que
    // haga falta recargar la pagina a mano.
    setInterval(function () {
      refreshResumenWindow();
      if (currentTab === "escalamientosIT") renderEscalamientosIT();
      if (currentTab === "tareas") refreshTareasWindow();
      fetchLastRun().then(function (value) { lastRunInfo = value; });
    }, RESUMEN_REFRESH_MS);
  }

  bootstrap();

  themeToggle.addEventListener("click", function () {
    currentTheme = currentTheme === "dark" ? "light" : "dark";
    applyTheme(currentTheme);
    try { localStorage.setItem(THEME_KEY, currentTheme); } catch (e) {}
    rerenderCurrent();
  });

  var customBtn = document.getElementById("customBtn");
  function customMsgEl() { return document.getElementById("customMsg"); }

  customBtn.addEventListener("click", function () {
    var fromVal = document.getElementById("customFrom").value;
    var toVal = document.getElementById("customTo").value;
    var msg = customMsgEl();
    if (!fromVal || !toVal) {
      msg.textContent = "Completá Desde y Hasta.";
      return;
    }
    var fromMs = new Date(fromVal).getTime();
    var toMs = new Date(toVal).getTime();
    if (isNaN(fromMs) || isNaN(toMs)) {
      msg.textContent = "Fechas inválidas.";
      return;
    }
    if (fromMs > toMs) {
      msg.textContent = "\"Desde\" tiene que ser anterior a \"Hasta\".";
      return;
    }
    msg.textContent = "";
    applyLapsoRange(fromMs, toMs);
  });
})();
</script>

</body>
